behaviors:
  MoveToGoal:
    trainer_type: ppo
    hyperparameters:
      # 2026-05-19 v2-RETUNE-v2 (beta bump from 1e-2 to 5e-2 after seed_0 still collapsed).
      #
      # Empirical evidence at beta=1e-2 with batch=256/buffer=1024/lambd=0.95/num_epoch=4:
      #   - seed_0 (5M done): reward -0.39, entropy 0.35 → COLLAPSED, never found goal
      #   - seed_1 (5M done): reward +0.974 (98.7% proxy succ), entropy 0.69 → mastered
      #   - seed_2 (in progress at 862k): reward -0.30, entropy 1.99 → trending up
      # 1/3 to 2/3 success rate. Classic PPO sparse-reward seed-luck: seeds that don't find
      # goal early collapse entropy on wall-avoidance. SAC had 3/3 success with std 0.0034.
      #
      # Decision: bump beta further to maximize success across all 3 seeds.
      #   - beta 1.0e-2 → 5.0e-2 (5× this round, 100× v1) — pushes exploration past collapse threshold
      #   - lambd stays 0.95 (working)
      #   - other params unchanged
      # Honest manuscript framing: "v1 entropy coefficient (5e-4) was 100× too low for the
      # upgraded engine + library stack to sustain exploration on this sparse-terminal-reward
      # task; raised to 5e-2 to ensure consistent learning across seeds. Confirmed empirically
      # at intermediate values 1e-2 (which gave seed-variance instability)."
      batch_size: 256
      buffer_size: 1024
      learning_rate: 3.0e-4
      beta: 5.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 4
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 5000000
    time_horizon: 64
    summary_freq: 2000